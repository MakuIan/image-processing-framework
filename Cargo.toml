[package]
name = "image-processing-framework"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = "0.25"
rand = "0.8"
rand_distr = "0.4"
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
indicatif = "0.17"
wgpu = "24"
pollster = "1.0"
bytemuck = { version = "1.19", features = ["derive"] }
